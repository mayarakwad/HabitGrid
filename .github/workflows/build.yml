# Builds HabitGrid for Windows (HabitGrid-Setup.exe and HabitGrid.exe) and macOS (HabitGrid.dmg
# and HabitGrid-mac.zip) on GitHub-hosted machines, runs the tests there, checks each built app
# opens, and on Windows installs and uninstalls the setup wizard. Download the builds from the
# run's Artifacts.
# Pushing a version tag (git tag v1.1.0 && git push origin v1.1.0) also publishes them as a
# public GitHub Release.
# Google sign-in is built in when the repository has a GOOGLE_CLIENT_JSON secret (the JSON file
# of a Google Cloud "Desktop app" OAuth client; see the README).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt
          .venv\Scripts\python -m unittest -v

      - name: Add the Google sign-in client
        shell: pwsh
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          # Reported as an annotation (visible on the run page) without ever printing the secret.
          if (-not $env:GOOGLE_CLIENT_JSON) {
            '::warning title=Google sign-in: off::No repository secret named GOOGLE_CLIENT_JSON, so this build has no Google sign-in.'
            exit 0
          }
          Set-Content google_client.json $env:GOOGLE_CLIENT_JSON -Encoding utf8
          $ok = .venv\Scripts\python -c "import google_auth; print('yes' if google_auth.load_client('google_client.json', env={}) else 'no')"
          if ($ok -eq 'yes') { '::notice title=Google sign-in: on::GOOGLE_CLIENT_JSON is a valid OAuth client and is built into this app.' }
          else {
            Remove-Item google_client.json
            '::warning title=Google sign-in: off::GOOGLE_CLIENT_JSON is set but is not the JSON file of a Google Cloud Desktop app OAuth client (it needs client_id and client_secret).'
          }

      - name: Get Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build HabitGrid.exe and HabitGrid-Setup.exe
        shell: cmd
        run: build.bat

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: HabitGrid-windows
          path: |
            dist/HabitGrid.exe
            dist/HabitGrid-Setup.exe
          if-no-files-found: error

      - name: Check the built app opens its window
        shell: pwsh
        run: |
          $env:HABITGRID_DATA_DIR = Join-Path $env:RUNNER_TEMP 'habitgrid-data'  # fresh data, nothing in the runner's profile
          $p = Start-Process dist\HabitGrid.exe -PassThru
          $deadline = (Get-Date).AddSeconds(45)
          # A crash shows PyInstaller's error box instead, which has a different title.
          while (-not (Get-Process HabitGrid -ErrorAction SilentlyContinue | Where-Object MainWindowTitle -eq 'HabitGrid')) {
            if ($p.HasExited) { Write-Error "HabitGrid exited during startup (code $($p.ExitCode))"; exit 1 }
            if ((Get-Date) -gt $deadline) { Write-Error 'HabitGrid did not open its window within 45 seconds'; exit 1 }
            Start-Sleep -Milliseconds 500
          }
          Write-Host 'HabitGrid window is open'
          taskkill /PID $p.Id /T /F | Out-Null

      - name: Install, open and uninstall with the setup wizard
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'HabitGrid install'
          $setup = Start-Process dist\HabitGrid-Setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=`"$dir`""
          if ($setup.ExitCode -ne 0) { Write-Error "Setup failed (code $($setup.ExitCode))"; exit 1 }
          $exe = Join-Path $dir 'HabitGrid.exe'
          $menu = Join-Path ([Environment]::GetFolderPath('Programs')) 'HabitGrid.lnk'
          foreach ($f in $exe, $menu) { if (-not (Test-Path $f)) { Write-Error "Setup didn't create $f"; exit 1 } }
          Write-Host 'Installed, with a Start menu shortcut'

          $env:HABITGRID_DATA_DIR = Join-Path $env:RUNNER_TEMP 'habitgrid-data-installed'
          $p = Start-Process $exe -PassThru
          $deadline = (Get-Date).AddSeconds(45)
          while (-not (Get-Process HabitGrid -ErrorAction SilentlyContinue | Where-Object MainWindowTitle -eq 'HabitGrid')) {
            if ($p.HasExited -or (Get-Date) -gt $deadline) { Write-Error 'The installed HabitGrid did not open its window'; exit 1 }
            Start-Sleep -Milliseconds 500
          }
          Write-Host 'The installed app opens'
          taskkill /PID $p.Id /T /F | Out-Null
          Start-Sleep -Seconds 2

          Start-Process (Join-Path $dir 'unins000.exe') -Wait -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          $deadline = (Get-Date).AddSeconds(60)
          while ((Test-Path $exe) -or (Test-Path $menu)) {  # the uninstaller finishes in a copy of itself
            if ((Get-Date) -gt $deadline) { Write-Error 'Uninstall left HabitGrid behind'; exit 1 }
            Start-Sleep -Seconds 1
          }
          Write-Host 'Uninstalled cleanly'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m unittest -v

      - name: Add the Google sign-in client
        env:
          GOOGLE_CLIENT_JSON: ${{ secrets.GOOGLE_CLIENT_JSON }}
        run: |
          if [ -n "$GOOGLE_CLIENT_JSON" ]; then printf '%s' "$GOOGLE_CLIENT_JSON" > google_client.json; echo "Google sign-in: on"
          else echo "Google sign-in: off (no GOOGLE_CLIENT_JSON secret)"; fi

      - name: Build HabitGrid.app
        run: bash build_mac.sh

      - name: Check the disk image
        run: hdiutil verify dist/HabitGrid.dmg

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: HabitGrid-mac
          path: |
            dist/HabitGrid.dmg
            dist/HabitGrid-mac.zip
          if-no-files-found: error

      - name: Check the built app starts
        run: |
          export HABITGRID_DATA_DIR="$(mktemp -d)"  # fresh data, nothing in the runner's home
          ./dist/HabitGrid.app/Contents/MacOS/HabitGrid > app-output.txt 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            code=0
            wait "$pid" || code=$?
            cat app-output.txt
            echo "::error title=HabitGrid exited during startup (code $code)::$(tail -n 20 app-output.txt | tr '\n' ' ')"
            exit 1
          fi
          kill "$pid"

  # Windows is published as soon as it's built, so a long queue for GitHub's Mac machines
  # can't hold the release back. release-mac adds the Mac files to the same release once
  # the Mac build succeeds (if it couldn't get a machine, "Re-run failed jobs" does both).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to publish the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HabitGrid-windows
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GOOGLE_ON: ${{ secrets.GOOGLE_CLIENT_JSON != '' }}
        run: |
          if [ "$GOOGLE_ON" = "true" ]; then signin="Sign in with your email and password, or with Google."
          else signin="Sign in with your email and password."; fi
          cat > release-notes.md <<'EOF'
          HabitGrid is a small habit tracker for your computer: a monthly checkbox grid, charts, a Today view, profiles and themes. SIGN_IN_LINE Your habits stay on your computer.

          ### Windows
          Download **HabitGrid-Setup.exe** and run it: it installs HabitGrid with Start menu and Desktop shortcuts and an uninstaller (Settings > Apps). No administrator rights needed.
          Prefer no install? **HabitGrid.exe** runs as is.

          The app isn't code-signed yet, so Windows may say "Windows protected your PC": click **More info**, then **Run anyway**. If Smart App Control blocks it completely, run HabitGrid from the source instead (see "Smart App Control" in the README).

          Your data is saved in `%APPDATA%\HabitGrid\data.json` and stays there if you uninstall.

          <!-- mac -->
          ### macOS
          The Mac version is added here as soon as GitHub's Mac build has run.
          <!-- /mac -->
          EOF
          sed -i "s/SIGN_IN_LINE/$signin/" release-notes.md
          gh release create "$GITHUB_REF_NAME" dist/HabitGrid-Setup.exe dist/HabitGrid.exe \
            --repo "$GITHUB_REPOSITORY" --title "HabitGrid $GITHUB_REF_NAME" --notes-file release-notes.md

  release-mac:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to add to the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: HabitGrid-mac
          path: dist

      - name: Add the Mac version to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" dist/HabitGrid.dmg dist/HabitGrid-mac.zip --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          cat > mac.md <<'EOF'
          ### macOS (Apple Silicon, M1 or later)
          Not yet tested by a person on a real Mac; please report what happens.
          Open **HabitGrid.dmg** and drag HabitGrid to Applications. Because the app isn't notarized yet, macOS will refuse to open it the first time: go to System Settings > Privacy & Security and click **Open Anyway**. Or install it from Terminal, which skips that step:

          ```
          mkdir -p ~/Applications && curl -fL -o /tmp/HabitGrid-mac.zip https://github.com/mayarakwad/HabitGrid/releases/latest/download/HabitGrid-mac.zip && ditto -x -k /tmp/HabitGrid-mac.zip ~/Applications && open ~/Applications/HabitGrid.app
          ```

          Your data is saved in `~/Library/Application Support/HabitGrid/data.json`.
          EOF
          python3 - <<'PY'
          import re
          notes = open("notes.md", encoding="utf-8").read()
          mac = open("mac.md", encoding="utf-8").read().strip()
          notes = re.sub(r"<!-- mac -->.*?<!-- /mac -->", lambda m: "<!-- mac -->\n" + mac + "\n<!-- /mac -->", notes, flags=re.S)
          open("notes.md", "w", encoding="utf-8").write(notes)
          PY
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
