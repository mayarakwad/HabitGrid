# Builds HabitGrid for Windows (HabitGrid.exe) and macOS (HabitGrid.app) on GitHub-hosted
# machines, runs the tests there, and checks each built app opens its window.
# Download the builds from the run's Artifacts.
# Pushing a version tag (git tag v1.0.0 && git push origin v1.0.0) also publishes both
# as a public GitHub Release.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m venv .venv
          .venv\Scripts\python -m pip install -r requirements.txt
          .venv\Scripts\python -m unittest -v

      - name: Build HabitGrid.exe
        shell: cmd
        run: build.bat

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: HabitGrid-windows
          path: dist/HabitGrid.exe
          if-no-files-found: error

      - name: Check the built app opens its window
        shell: pwsh
        run: |
          $env:HABITGRID_DATA_DIR = Join-Path $env:RUNNER_TEMP 'habitgrid-data'  # fresh data, nothing in the runner's profile
          $p = Start-Process dist\HabitGrid.exe -PassThru
          $deadline = (Get-Date).AddSeconds(45)
          # A crash shows PyInstaller's error box instead, which has a different title.
          while (-not (Get-Process HabitGrid -ErrorAction SilentlyContinue | Where-Object MainWindowTitle -eq 'HabitGrid')) {
            if ($p.HasExited) { Write-Error "HabitGrid exited during startup (code $($p.ExitCode))"; exit 1 }
            if ((Get-Date) -gt $deadline) { Write-Error 'HabitGrid did not open its window within 45 seconds'; exit 1 }
            Start-Sleep -Milliseconds 500
          }
          Write-Host 'HabitGrid window is open'
          taskkill /PID $p.Id /T /F | Out-Null

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m unittest -v

      - name: Build HabitGrid.app
        run: bash build_mac.sh

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: HabitGrid-mac
          path: dist/HabitGrid-mac.zip
          if-no-files-found: error

      - name: Check the built app starts
        run: |
          export HABITGRID_DATA_DIR="$(mktemp -d)"  # fresh data, nothing in the runner's home
          ./dist/HabitGrid.app/Contents/MacOS/HabitGrid > app-output.txt 2>&1 &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2>/dev/null; then
            code=0
            wait "$pid" || code=$?
            cat app-output.txt
            echo "::error title=HabitGrid exited during startup (code $code)::$(tail -n 20 app-output.txt | tr '\n' ' ')"
            exit 1
          fi
          kill "$pid"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to publish the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          HabitGrid is a small habit tracker for your computer: a monthly checkbox grid, charts, a Today view, profiles and themes. Your data stays on your computer.

          ### Windows
          Download **HabitGrid.exe** and double-click it. Nothing to install.

          The app isn't code-signed yet, so Windows may say "Windows protected your PC": click **More info**, then **Run anyway**. If Smart App Control blocks it completely, run HabitGrid from the source instead (see "Smart App Control" in the README).

          Your data is saved in `%APPDATA%\HabitGrid\data.json`.

          ### macOS (Apple Silicon, M1 or later)
          Not yet tested by a person on a real Mac; please report what happens. Install and open it from Terminal:

          ```
          mkdir -p ~/Applications && curl -fL -o /tmp/HabitGrid-mac.zip https://github.com/mayarakwad/HabitGrid/releases/latest/download/HabitGrid-mac.zip && ditto -x -k /tmp/HabitGrid-mac.zip ~/Applications && open ~/Applications/HabitGrid.app
          ```

          Your data is saved in `~/Library/Application Support/HabitGrid/data.json`.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/HabitGrid.exe dist/HabitGrid-mac.zip \
            --repo "$GITHUB_REPOSITORY" --title "HabitGrid $GITHUB_REF_NAME" --notes-file release-notes.md
