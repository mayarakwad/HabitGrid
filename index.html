<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HabitGrid</title>
  <meta name="description" content="A tiny, private habit tracker with a monthly grid, charts, profiles and themes.">
  <meta name="theme-color" content="#191919">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // Apply the last-used theme before first paint so there's no flash of the wrong colors.
    (function () {
      try {
        var l = JSON.parse(localStorage.getItem('hg.look') || '{}'), d = document.documentElement, t = l.theme || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'paper' : 'midnight';
        d.dataset.theme = t;
        ['font', 'size', 'density', 'radius', 'cb', 'motion'].forEach(function (k) { if (l[k]) d.dataset[k] = l[k]; });
        if (/^#[0-9a-f]{6}$/i.test(l.accent || '')) d.style.setProperty('--accent', l.accent);
      } catch (e) { /* first visit */ }
    })();
  </script>
</head>
<body>
  <div id="app"><noscript><p style="padding:24px">HabitGrid needs JavaScript to run.</p></noscript></div>
  <div id="modal-root" hidden></div>
  <div id="toast-root" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
